    <style>
        :root {
            --primary-bg: #111827;
            --accent-yellow: #ffb703;
            --accent-cyan: #00b4d8;
            --accent-blue: #1d4ed8;
            --text-light: #ffffff;
            --text-gray: #cbd5e1;
            --card-bg: rgba(17, 24, 39, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow-x: hidden;
        }

        /* Fondo Animado Profesional en Color Amarillo con Ondas */
        .pro-tv-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
            background: linear-gradient(135deg, #1f1301 0%, #3d2c04 40%, #785202 80%, #1f1301 100%);
            background-size: 300% 300%;
            animation: gradientMove 12s ease infinite alternate;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .dynamic-waves {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: -2;
            background: radial-gradient(circle, rgba(255, 183, 3, 0.25) 0%, rgba(120, 82, 2, 0.4) 40%, rgba(0, 180, 216, 0.15) 70%, transparent 100%);
            animation: rotateWaves 20s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateWaves {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Destellos Dinámicos en Azul y Blanco */
        .sparkle-blue, .sparkle-white {
            position: absolute;
            border-radius: 50%;
            animation: floatSparkle 4s infinite linear;
            z-index: -1;
        }

        .sparkle-blue {
            background: radial-gradient(circle, #00b4d8 0%, rgba(0, 180, 216, 0) 70%);
            box-shadow: 0 0 12px #00b4d8;
        }

        .sparkle-white {
            background: radial-gradient(circle, #ffffff 0%, rgba(255, 255, 255, 0) 70%);
            box-shadow: 0 0 10px #ffffff;
        }

        @keyframes floatSparkle {
            0% { transform: translateY(105vh) scale(0.2); opacity: 0; }
            40% { opacity: 1; }
            80% { opacity: 0.7; }
            100% { transform: translateY(-10vh) scale(1.4); opacity: 0; }
        }

        /* Cabecera Adaptable con Pestaña adjunta */
        header {
            background: rgba(17, 24, 39, 0.92);
            backdrop-filter: blur(16px);
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 2px solid rgba(255, 183, 3, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            z-index: 10;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .channel-logo {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid var(--accent-yellow);
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.7);
        }

        .logo-container {
            display: flex;
            flex-direction: column;
        }

        .logo-container h1 {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--text-light);
            letter-spacing: 1px;
            text-shadow: 0 2px 12px rgba(255, 183, 3, 0.6);
        }

        .logo-container h1 span {
            color: var(--accent-yellow);
        }

        .logo-container .location-tag {
            font-size: 0.7rem;
            color: var(--accent-yellow);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Enlace / Pestaña adjunta a enet.com.pe */
        .external-tab-btn {
            background: rgba(255, 183, 3, 0.15);
            border: 1px solid var(--accent-yellow);
            color: var(--accent-yellow);
            padding: 6px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(255, 183, 3, 0.2);
        }

        .external-tab-btn:hover {
            background: var(--accent-yellow);
            color: #111827;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.5);
        }

        .channel-selector-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(31, 19, 1, 0.8);
            border: 1px solid var(--accent-yellow);
            padding: 5px 10px;
            border-radius: 8px;
        }

        .channel-selector-bar label {
            font-size: 0.75rem;
            color: var(--accent-yellow);
            font-weight: bold;
            text-transform: uppercase;
        }

        #channelSelect {
            background: #111827;
            color: var(--text-light);
            border: 1px solid var(--accent-yellow);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .top-clock {
            font-size: 0.8rem;
            color: var(--text-light);
            background: rgba(255, 183, 3, 0.1);
            border: 1px solid rgba(255, 183, 3, 0.4);
            padding: 4px 10px;
            border-radius: 20px;
            text-align: center;
        }

        .visitor-counter {
            background: rgba(0, 180, 216, 0.15);
            border: 1px solid rgba(0, 180, 216, 0.4);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .live-badge {
            background-color: #ff3b30;
            color: white;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.8);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Contenido Principal en Grid */
        main {
            flex: 1;
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem 1rem;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            z-index: 1;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
                padding: 1rem 0.5rem;
            }
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .player-wrapper {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(255, 183, 3, 0.3);
            border: 2px solid var(--accent-yellow);
            aspect-ratio: 16/9;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
        }

        .channel-info {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-left: 4px solid var(--accent-yellow);
            border: 1px solid rgba(255, 183, 3, 0.3);
            padding: 1rem 1.2rem;
            border-radius: 0 10px 10px 0;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .channel-info h2 {
            font-size: 1.05rem;
            color: var(--accent-yellow);
            text-shadow: 0 2px 8px rgba(255, 183, 3, 0.4);
            letter-spacing: 0.5px;
        }

        .btn-facebook {
            background-color: #1877f2;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(24, 119, 242, 0.5);
            width: auto;
        }

        @media (max-width: 600px) {
            .btn-facebook {
                width: 100%;
            }
        }

        .btn-facebook:hover {
            background-color: #165fe5;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(24, 119, 242, 0.7);
        }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* CUADRO DE CIUDADES */
        .cities-showcase-box {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--accent-yellow);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
        }

        .cities-showcase-header {
            background: rgba(31, 19, 1, 0.9);
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 183, 3, 0.3);
        }

        .cities-showcase-header h4 {
            font-size: 0.85rem;
            color: var(--accent-yellow);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .slideshow-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/10;
            background: #1f1301;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .city-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .city-item.active {
            opacity: 1;
        }

        .city-slide {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2c1d02, #111827);
            color: var(--accent-yellow);
            font-weight: bold;
            font-size: 1.2rem;
            text-align: center;
        }

        .city-name-tag {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
            padding: 15px 10px 8px 10px;
            text-align: center;
            z-index: 5;
        }

        .city-name-tag span {
            color: var(--accent-yellow);
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
