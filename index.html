<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENET FIBER PERU - ENTORNO DIGITAL ONLINE S.A.C. | Señal en Vivo HD</title>
    <meta name="description" content="Sitio oficial de ENET FIBER PERU, operado por ENTORNO DIGITAL ONLINE S.A.C. Canales en vivo en alta definición.">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --primary-bg: #111827;
            --accent-yellow: #ffb703;
            --accent-cyan: #00b4d8;
            --text-light: #ffffff;
            --text-gray: #cbd5e1;
            --card-bg: rgba(17, 24, 39, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            background: rgba(17, 24, 39, 0.98);
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 2px solid rgba(255, 183, 3, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-container h1 {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--text-light);
        }

        .logo-container h1 span {
            color: var(--accent-yellow);
        }

        .logo-container .location-tag {
            font-size: 0.7rem;
            color: var(--accent-yellow);
            font-weight: 600;
            text-transform: uppercase;
        }

        .channel-selector-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(31, 19, 1, 0.8);
            border: 1px solid var(--accent-yellow);
            padding: 5px 10px;
            border-radius: 8px;
        }

        .channel-selector-bar label {
            font-size: 0.75rem;
            color: var(--accent-yellow);
            font-weight: bold;
        }

        #channelSelect {
            background: #111827;
            color: var(--text-light);
            border: 1px solid var(--accent-yellow);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .top-clock, .visitor-counter {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 183, 3, 0.1);
            border: 1px solid rgba(255, 183, 3, 0.4);
        }

        .live-badge {
            background-color: #ff3b30;
            color: white;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 20px;
            text-transform: uppercase;
        }

        main {
            flex: 1;
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem 1rem;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .player-wrapper {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--accent-yellow);
            aspect-ratio: 16/9;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
        }

        .channel-info {
            background: var(--card-bg);
            border-left: 4px solid var(--accent-yellow);
            padding: 1rem 1.2rem;
            border-radius: 0 10px 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .channel-info h2 {
            font-size: 1.05rem;
            color: var(--accent-yellow);
        }

        .btn-facebook {
            background-color: #1877f2;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* PORTADA INTERACTIVA */
        .cover-banner-box {
            width: 100%;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--accent-yellow);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .cover-banner-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 183, 3, 0.4);
        }

        .cover-image-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #1f1301;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cover-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cover-footer-link {
            background: rgba(31, 19, 1, 0.95);
            padding: 12px;
            text-align: center;
            border-top: 1px solid rgba(255, 183, 3, 0.3);
            color: var(--accent-yellow);
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* SECCIÓN DE PUBLICIDAD Y PATROCINADORES */
        .ads-vertical-container {
            width: 100%;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 183, 3, 0.4);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .ads-vertical-container h4 {
            font-size: 0.8rem;
            color: var(--accent-yellow);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ads-vertical-media {
            width: 100%;
            max-height: 350px;
            border-radius: 8px;
            object-fit: cover;
            display: block;
            border: 1px solid rgba(255, 183, 3, 0.2);
        }

        /* CUADRO DE CIUDADES CON FOTOS EN TRANSICIÓN */
        .cities-showcase-box {
            width: 100%;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--accent-yellow);
            display: flex;
            flex-direction: column;
        }

        .cities-showcase-header {
            background: rgba(31, 19, 1, 0.9);
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 183, 3, 0.3);
        }

        .cities-showcase-header h4 {
            font-size: 0.85rem;
            color: var(--accent-yellow);
            text-transform: uppercase;
        }

        .slideshow-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #1f1301;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .city-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .city-item.active {
            opacity: 1;
        }

        .city-slide {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Etiqueta flotante con el nombre de la ciudad */
        .city-name-tag {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
            padding: 15px 10px 8px 10px;
            text-align: center;
            z-index: 5;
        }

        .city-name-tag span {
            color: var(--accent-yellow);
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: rgba(17, 24, 39, 0.85);
            padding: 3px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 183, 3, 0.5);
        }

        footer {
            background-color: rgba(31, 19, 1, 0.95);
            text-align: center;
            padding: 1.2rem;
            font-size: 0.85rem;
            color: var(--text-gray);
            border-top: 1px solid rgba(255, 183, 3, 0.3);
        }

        footer span {
            color: var(--accent-yellow);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <div class="logo-container">
                <h1>ENET FIBER <span>PERÚ</span></h1>
                <span class="location-tag">ENTORNO DIGITAL ONLINE S.A.C.</span>
            </div>
        </div>

        <div class="channel-selector-bar">
            <label for="channelSelect">📺 CANAL:</label>
            <select id="channelSelect" onchange="cambiarCanal(this.value)">
                <option value="https://vs20.live.opencaster.com/emaxtelevision_2a1a1467/index.m3u8" data-nombre="EMAX TV">EMAX TV</option>
                <option value="https://vs20.live.opencaster.com/emusic_6696aed5/index.m3u8" data-nombre="EMUSIC">EMUSIC</option>
            </select>
        </div>

        <div class="header-stats">
            <div class="top-clock" id="topClock">Cargando...</div>
            <div class="visitor-counter">Visitas: <span id="count">1250</span></div>
            <div class="live-badge">● EN VIVO</div>
        </div>
    </header>

    <main>
        <div class="left-column">
            <div class="player-wrapper">
                <video id="videoPlayer" controls autoplay muted playsinline></video>
            </div>
            <div class="channel-info">
                <div><h2 id="channelTitleDisplay">SEÑAL EN VIVO - EMAX TV</h2></div>
                <a href="https://www.facebook.com/enetfiberperu" target="_blank" class="btn-facebook">👍 Facebook</a>
            </div>
        </div>

        <aside class="right-column">
            <!-- PORTADA INTERACTIVA -->
            <a href="https://enet.com.pe/" target="_blank" class="cover-banner-box">
                <div class="cover-image-container">
                    <img src="portada.jpeg" alt="ENET Fiber Perú Portada">
                </div>
                <div class="cover-footer-link">
                    🌐 Visitar web oficial: enet.com.pe ↗
                </div>
            </a>

            <!-- PATROCINADOR -->
            <div class="ads-vertical-container">
                <h4>Patrocinador Exclusivo</h4>
                <a href="https://enet.com.pe/" target="_blank" style="width: 100%;">
                    <img src="anuncio.jpg" alt="Patrocinador Oficial" class="ads-vertical-media">
                </a>
            </div>

            <!-- CUADRO DE COBERTURA NACIONAL CON FOTOS ROTATIVAS -->
            <div class="cities-showcase-box">
                <div class="cities-showcase-header"><h4>Cobertura Nacional</h4></div>
                <div class="slideshow-container" id="slideshowContainer">
                    <div class="city-item active" data-name="Bagua">
                        <img src="bagua.jpg" class="city-slide" alt="Bagua">
                    </div>
                    <div class="city-item" data-name="Bellavista">
                        <img src="bellavista.jpg" class="city-slide" alt="Bellavista">
                    </div>
                    <div class="city-item" data-name="Jaén">
                        <img src="jaen.jpg" class="city-slide" alt="Jaén">
                    </div>
                    <div class="city-item" data-name="Juanjui">
                        <img src="juanjui.jpg" class="city-slide" alt="Juanjui">
                    </div>
                    <div class="city-item" data-name="Naranjillo">
                        <img src="naranjillo.jpg" class="city-slide" alt="Naranjillo">
                    </div>
                    <div class="city-item" data-name="El Porvenir">
                        <img src="porvenir.jpg" class="city-slide" alt="El Porvenir">
                    </div>
                    <div class="city-item" data-name="Rioja">
                        <img src="rioja.jpg" class="city-slide" alt="Rioja">
                    </div>
                    <div class="city-item" data-name="Soritor">
                        <img src="soritor.jpg" class="city-slide" alt="Soritor">
                    </div>
                    <div class="city-item" data-name="Trujillo">
                        <img src="trujillo.jpg" class="city-slide" alt="Trujillo">
                    </div>

                    <div class="city-name-tag">
                        <span id="cityNameDisplay">Bagua</span>
                    </div>
                </div>
            </div>

            <!-- SPOT PUBLICITARIO -->
            <div class="ads-vertical-container">
                <h4>Spot Publicitario</h4>
                <video class="ads-vertical-media" autoplay muted loop playsinline>
                    <source src="anuncio.mp4" type="video/mp4">
                    Tu navegador no soporta videos publicitarios.
                </video>
            </div>
        </aside>
    </main>

    <footer>
        <p>&copy; 2026 <span>ENTORNO DIGITAL ONLINE S.A.C.</span></p>
    </footer>

    <script>
        // Transición de fotos de ciudades cada 2 segundos
        let currentSlide = 0;
        const cityItems = document.querySelectorAll('.city-item');
        const cityNameDisplay = document.getElementById('cityNameDisplay');

        function nextCitySlide() {
            if (cityItems.length === 0) return;
            cityItems[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % cityItems.length;
            cityItems[currentSlide].classList.add('active');
            
            let cityName = cityItems[currentSlide].getAttribute('data-name');
            cityNameDisplay.innerText = cityName;
        }
        setInterval(nextCitySlide, 2000);

        var video = document.getElementById('videoPlayer');
        var hls;
        function cargarStream(url) {
            if (hls) hls.destroy();
            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e => console.log(e)));
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => video.play().catch(e => console.log(e)));
            }
        }
        cargarStream('https://vs20.live.opencaster.com/emaxtelevision_2a1a1467/index.m3u8');

        function cambiarCanal(urlStream) {
            let select = document.getElementById('channelSelect');
            let name = select.options[select.selectedIndex].getAttribute('data-nombre');
            document.getElementById('channelTitleDisplay').innerText = `SEÑAL EN VIVO - ${name}`;
            cargarStream(urlStream);
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('topClock').innerText = now.toLocaleDateString() + ' | ' + now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
